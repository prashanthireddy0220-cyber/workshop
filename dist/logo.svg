<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <linearGradient id="ieeeOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ieeeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2952" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Emblem Group (Book + Circuits) -->
  <g transform="translate(130, 10)">
    <!-- Circuit Lines extending from top right -->
    <path d="M 45 35 Q 65 15 95 10" fill="none" stroke="url(#ieeeOrangeGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="95" cy="10" r="4.5" fill="#F97316" />
    
    <path d="M 40 45 Q 60 25 105 25" fill="none" stroke="url(#ieeeBlueGrad)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="105" cy="25" r="5" fill="#1E2952" />

    <!-- Open Book Left Wings -->
    <path d="M 30 65 Q 10 40 -25 48 Q 0 75 30 65 Z" fill="#0F172A" />
    <path d="M 28 53 Q 5 32 -20 38 Q 2 62 28 53 Z" fill="url(#ieeeOrangeGrad)" />

    <!-- Open Book Right Wings -->
    <path d="M 30 65 Q 50 40 85 48 Q 60 75 30 65 Z" fill="#0F172A" />
    <path d="M 32 53 Q 55 32 80 38 Q 58 62 32 53 Z" fill="url(#ieeeOrangeGrad)" />

    <!-- Book Spine / Base Curve -->
    <path d="M -30 68 Q 30 52 90 68 Q 30 82 -30 68 Z" fill="#0F172A" />
  </g>

  <!-- Typography Group -->
  <!-- KARE Text -->
  <text x="15" y="32" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1.5">KARE</text>
  
  <!-- IEEE Text -->
  <text x="15" y="65" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#F97316" letter-spacing="1">IEEE</text>
  
  <!-- Education Society Text -->
  <text x="15" y="105" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">Education Society</text>
</svg>
