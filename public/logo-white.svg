<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .logo-serif {
        font-family: 'Times New Roman', Times, Georgia, serif;
        font-weight: 700;
      }
      .logo-sans-heavy {
        font-family: 'Arial Black', 'Inter', 'Segoe UI', sans-serif;
        font-weight: 900;
      }
      .logo-sans-bold {
        font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
    <linearGradient id="ieeeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0651E" />
      <stop offset="100%" stop-color="#D85510" />
    </linearGradient>
  </defs>

  <!-- Solid Crisp White Background -->
  <rect x="0" y="0" width="460" height="150" rx="14" fill="#FFFFFF" />

  <!-- Left Column Text: KARE & IEEE -->
  <!-- KARE (Dark Navy Serif) -->
  <text x="18" y="39" class="logo-serif" font-size="30" fill="#16284F" letter-spacing="1">KARE</text>
  
  <!-- IEEE (Orange Heavy Sans-Serif) -->
  <text x="18" y="83" class="logo-sans-heavy" font-size="44" fill="url(#ieeeOrange)" letter-spacing="0.5">IEEE</text>
  
  <!-- Bottom Row Text: Education Society (Dark Navy Bold Sans-Serif) -->
  <text x="18" y="129" class="logo-sans-bold" font-size="35" fill="#16284F" letter-spacing="-0.5">Education Society</text>

  <!-- Right Column Emblem (Open Book + Circuit Arcs) -->
  <g transform="translate(160, 10)">
    <!-- Tech Circuit Arcs (Top Right Curve) -->
    <!-- Arc 1: Outer Top (Orange) -->
    <path d="M 40 50 Q 55 12 110 14 Q 135 16 155 30" fill="none" stroke="url(#ieeeOrange)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="155" cy="30" r="5" fill="#E0651E" />

    <!-- Arc 2: Middle (Navy) -->
    <path d="M 36 56 Q 52 24 102 26 Q 124 28 140 40" fill="none" stroke="#16284F" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="140" cy="40" r="5" fill="#16284F" />

    <!-- Arc 3: Inner (Navy Accent) -->
    <path d="M 32 62 Q 48 36 92 38 Q 112 40 124 50" fill="none" stroke="#16284F" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="124" cy="50" r="4" fill="#16284F" />

    <!-- Open Book Vector -->
    <!-- Book Base / Spine Foundation -->
    <path d="M -15 80 Q 38 94 92 80 Q 38 68 -15 80 Z" fill="#16284F" />

    <!-- Left Wing - Outer Navy -->
    <path d="M 38 74 Q 15 48 -20 56 Q 5 84 38 74 Z" fill="#16284F" />
    <!-- Left Wing - Inner Orange Layer -->
    <path d="M 36 65 Q 16 44 -12 51 Q 8 74 36 65 Z" fill="url(#ieeeOrange)" />

    <!-- Right Wing - Outer Navy -->
    <path d="M 38 74 Q 62 48 97 56 Q 72 84 38 74 Z" fill="#16284F" />
    <!-- Right Wing - Inner Orange Layer -->
    <path d="M 40 65 Q 60 44 88 51 Q 68 74 40 65 Z" fill="url(#ieeeOrange)" />

    <!-- Center Spine Line -->
    <path d="M 38 62 L 38 76" stroke="#16284F" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
