<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .logo-serif {
        font-family: 'Times New Roman', Times, Georgia, serif;
        font-weight: 700;
      }
      .logo-sans-heavy {
        font-family: 'Arial Black', 'Inter', 'Segoe UI', sans-serif;
        font-weight: 900;
      }
      .logo-sans-bold {
        font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
    <linearGradient id="ieeeOrangeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A28" />
      <stop offset="100%" stop-color="#E0651E" />
    </linearGradient>
  </defs>

  <!-- Left Column Text: KARE & IEEE -->
  <!-- KARE (White Serif for dark background) -->
  <text x="12" y="34" class="logo-serif" font-size="30" fill="#FFFFFF" letter-spacing="1">KARE</text>
  
  <!-- IEEE (Vibrant Orange Heavy Sans-Serif) -->
  <text x="12" y="78" class="logo-sans-heavy" font-size="44" fill="url(#ieeeOrangeLight)" letter-spacing="0.5">IEEE</text>
  
  <!-- Bottom Row Text: Education Society (White Bold Sans-Serif for dark background) -->
  <text x="12" y="124" class="logo-sans-bold" font-size="35" fill="#FFFFFF" letter-spacing="-0.5">Education Society</text>

  <!-- Right Column Emblem (Open Book + Circuit Arcs) -->
  <g transform="translate(155, 6)">
    <!-- Tech Circuit Arcs (Top Right Curve) -->
    <!-- Arc 1: Outer Top (Orange) -->
    <path d="M 40 50 Q 55 12 110 14 Q 135 16 155 30" fill="none" stroke="url(#ieeeOrangeLight)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="155" cy="30" r="5" fill="#FF7A28" />

    <!-- Arc 2: Middle (White/Light Navy) -->
    <path d="M 36 56 Q 52 24 102 26 Q 124 28 140 40" fill="none" stroke="#E2E8F0" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="140" cy="40" r="5" fill="#E2E8F0" />

    <!-- Arc 3: Inner (White Accent) -->
    <path d="M 32 62 Q 48 36 92 38 Q 112 40 124 50" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="124" cy="50" r="4" fill="#94A3B8" />

    <!-- Open Book Vector -->
    <!-- Book Base / Spine Foundation -->
    <path d="M -15 80 Q 38 94 92 80 Q 38 68 -15 80 Z" fill="#E2E8F0" />

    <!-- Left Wing - Outer White/Light -->
    <path d="M 38 74 Q 15 48 -20 56 Q 5 84 38 74 Z" fill="#E2E8F0" />
    <!-- Left Wing - Inner Orange Layer -->
    <path d="M 36 65 Q 16 44 -12 51 Q 8 74 36 65 Z" fill="url(#ieeeOrangeLight)" />

    <!-- Right Wing - Outer White/Light -->
    <path d="M 38 74 Q 62 48 97 56 Q 72 84 38 74 Z" fill="#E2E8F0" />
    <!-- Right Wing - Inner Orange Layer -->
    <path d="M 40 65 Q 60 44 88 51 Q 68 74 40 65 Z" fill="url(#ieeeOrangeLight)" />

    <!-- Center Spine Line -->
    <path d="M 38 62 L 38 76" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
